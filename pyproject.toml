[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predseg"
version = "0.1.0"
description = "Medical image segmentation with latent predictive priors"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "torch>=2.4", "torchvision>=0.19", "numpy>=1.24", "pandas>=2.0",
    "Pillow>=10", "PyYAML>=6", "timm>=1.0", "monai>=1.3", "MedPy>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.9"]
text = ["transformers>=4.40,<5", "open_clip_torch>=2.24"]

[project.scripts]
predseg = "predseg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
