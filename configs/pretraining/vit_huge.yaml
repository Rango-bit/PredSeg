data:
  batch_size: 16
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  modality_column: modality_id
  num_workers: 2
  pin_mem: true
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
  csv_path: data/pretrain.csv
  image_root: data/images
  text_features_path: data/modality_features.pt
logging:
  folder: outputs/pretraining/vit_huge
  write_tag: jepa
  checkpoint_freq: 50
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 14
  pred_mask_scale:
  - 0.15
  - 0.2
meta:
  load_checkpoint: false
  model_name: vit_huge
  pred_depth: 12
  pred_emb_dim: 384
  pretrained_checkpoint: null
  load_pretrained_predictor: false
  read_checkpoint: null
  use_bfloat16: true
  port: 29500
  seed: 0
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 66
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.0001
  start_lr: 2.0e-05
  warmup: 5
  weight_decay: 0.04
train:
  loss_exp: 1.0
  predict_all: true
  offset_context_loss: false
  weight_distance_loss: true
  lambda_value: 1
  use_distribution_regularization: true
  regularization_method: visreg
  regularization_weight: 0.1
  use_conditional_regularization: true
  conditional_regularization_weight: 1.0
  regularization_text_center_weight: 1.0
  regularization_normalize_text_centers: false
  regularization_effective_beta: 0.9999
  regularization_min_group_size: 4
  visreg_num_projections: 256
  visreg_center_weight: 1.0
  visreg_scale_weight: 1.0
  visreg_shape_weight: 1.0
  visreg_eps: 1.0e-06
  lambda_progressive: true
